<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilbert 控制台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-mark">H</div>
          <span class="logo-text">Hilbert 控制台</span>
        </div>
        <button class="icon-btn" id="toggleSidebar" title="收起侧边栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>

      <button class="new-page-btn" id="newPageBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建页面
      </button>

      <nav class="page-list" id="pageList"><!-- 动态渲染 --></nav>

      <button class="settings-entry" id="settingsEntry">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar">A</div>
          <span>Admin</span>
        </div>
      </div>
    </aside>

    <!-- 侧边栏收起时的展开按钮 -->
    <button class="icon-btn expand-btn hidden" id="expandSidebar" title="展开侧边栏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>

    <!-- 右侧内容区 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="topbar-icon" id="topbarIcon">📊</span>
          <span id="topbarName">加载中…</span>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn hidden" id="editCancelBtn">取消</button>
          <button class="primary-btn hidden" id="editSaveBtn">保存</button>
          <button class="ghost-btn hidden" id="editToggleBtn" title="编辑文档">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            编辑
          </button>
          <button class="ghost-btn hidden" id="reloadBtn" title="刷新">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
          <a class="ghost-btn" id="openExternalBtn" target="_blank" rel="noopener" title="在新标签页打开">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            打开
          </a>
        </div>
      </header>

      <section class="content">
        <div class="iframe-wrap hidden" id="iframeWrap">
          <div class="loading-mask" id="loadingMask">
            <div class="spinner"></div>
            <p>页面加载中…</p>
          </div>
          <iframe id="mainFrame" title="嵌入页面" referrerpolicy="no-referrer"></iframe>
        </div>

        <!-- Markdown 文档渲染 / 编辑区 -->
        <div class="md-view hidden" id="mdView">
          <article class="md-body" id="mdBody"></article>
          <textarea class="md-editor hidden" id="mdEditor" placeholder="在这里输入 Markdown 内容…（Ctrl+S 保存）" spellcheck="false"></textarea>
        </div>

        <!-- 欢迎页（默认起始页） -->
        <div class="welcome-view" id="welcomeView">
          <div class="welcome-logo">H</div>
          <h1>欢迎使用 Hilbert 控制台</h1>
          <p>从左侧边栏选择一个页面查看，或新建一个页面开始使用</p>
          <div class="welcome-actions">
            <button class="primary-btn" id="welcomeNewBtn">＋ 新建页面</button>
            <button class="ghost-btn" id="welcomeSettingsBtn">管理分组</button>
          </div>
        </div>

        <!-- 设置页 -->
        <div class="settings-view hidden" id="settingsView">
          <div class="settings-card">
            <h2>分组管理</h2>
            <p class="settings-desc">分组用于整理左侧边栏中的页面，新建 / 编辑页面时可直接选择分组。删除分组后，其下页面会移至「未分组」。</p>
            <div class="group-add">
              <input type="text" id="newGroupName" placeholder="输入分组名称" maxlength="20" />
              <button class="primary-btn" id="addGroupBtn">添加分组</button>
            </div>
            <div class="form-error hidden" id="groupError"></div>
            <ul class="group-list" id="groupList"></ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">新建页面</h3>
        <button class="icon-btn" id="modalClose" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="pageForm">
        <div class="form-item">
          <label>页面类型</label>
          <div class="type-switch" id="typeSwitch">
            <button type="button" class="type-opt active" data-type="link">🔗 外部链接</button>
            <button type="button" class="type-opt" data-type="markdown">📝 Markdown 文档</button>
          </div>
        </div>
        <div class="form-item">
          <label>页面名称 <span class="required">*</span></label>
          <input type="text" id="fieldName" placeholder="例如：Grafana 监控面板" maxlength="40" required />
        </div>
        <div class="form-item" id="urlField">
          <label>嵌入链接 <span class="required">*</span></label>
          <input type="url" id="fieldUrl" placeholder="https://example.com/..." required />
        </div>
        <div class="form-item hidden" id="authField">
          <label class="checkbox-label">
            <input type="checkbox" id="authEnabled" />
            需要认证（自动登录 / 携带认证头）
          </label>
          <div class="auth-box hidden" id="authBox">
            <select id="authMode">
              <option value="basic">Basic Auth（Authorization 头）</option>
              <option value="login">表单登录（用户名密码登录，如 Grafana）</option>
              <option value="header">自定义请求头（如 Bearer 令牌）</option>
            </select>
            <div class="auth-inputs" id="authUserPass">
              <input type="text" id="authUser" placeholder="用户名" autocomplete="off" />
              <input type="password" id="authPass" placeholder="密码" autocomplete="new-password" />
            </div>
            <input type="text" class="auth-login-path hidden" id="authLoginPath" placeholder="登录接口路径（默认 /login）" />
            <div class="auth-inputs hidden" id="authHeaderInputs">
              <input type="text" id="authHeaderName" placeholder="请求头名称，如 Authorization" />
              <input type="text" id="authHeaderValue" placeholder="请求头值，如 Bearer xxx" />
            </div>
          </div>
          <p class="form-hint">启用后页面将通过本地反向代理加载并自动携带认证，同时绕过目标站的 iframe 嵌入限制</p>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>图标（emoji）</label>
            <input type="text" id="fieldIcon" placeholder="📊" maxlength="4" />
          </div>
          <div class="form-item">
            <label>分组</label>
            <select id="fieldGroup"></select>
          </div>
        </div>
        <div class="form-error hidden" id="formError"></div>
        <div class="form-actions">
          <button type="button" class="ghost-btn" id="cancelBtn">取消</button>
          <button type="submit" class="primary-btn" id="saveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay hidden" id="confirmOverlay">
    <div class="modal modal-sm">
      <div class="modal-header"><h3>删除页面</h3></div>
      <p class="confirm-text">确定要删除「<span id="confirmName"></span>」吗？此操作不可恢复。</p>
      <div class="form-actions">
        <button class="ghost-btn" id="confirmCancel">取消</button>
        <button class="danger-btn" id="confirmDelete">删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
